services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docutalk
      POSTGRES_PASSWORD: docutalk
      POSTGRES_DB: docutalk
    ports:
      - "5433:5432"
    volumes:
      - docutalk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docutalk -d docutalk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  docutalk_pg:
